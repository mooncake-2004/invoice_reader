name: Build Windows EXE

on:
  push:
    branches: [feature/i18n, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name InvoiceReader ^
            --collect-all pdfminer ^
            --collect-all invoice2data ^
            --hidden-import invoice2data.extract ^
            --hidden-import invoice2data.extract.invoice_template ^
            --hidden-import invoice2data.input ^
            --hidden-import invoice2data.output ^
            src/invoice_reader/__main__.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceReader-Windows
          path: dist/InvoiceReader.exe