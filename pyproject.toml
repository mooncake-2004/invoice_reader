[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-reader"
version = "0.1.0"
description = "Offline PDF viewer and field selection tool"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
    "invoice2data>=1.0,<2",
    "pypdfium2>=5,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

