name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Find mypyc .pyd files and build EXE
        shell: python
        run: |
          import subprocess
          import sys
          import site
          from pathlib import Path

          # 找到所有顶层 mypyc 编译的 .pyd 文件
          # mypyc 产生的顶层模块名形如 <hash>__mypyc.pyd，不在任何包目录下
          add_binary_args = []

          search_roots = site.getsitepackages()
          for root in search_roots:
              root_path = Path(root)
              if not root_path.exists():
                  continue
              # 只找顶层（depth=1）的 .pyd，名字含 __mypyc
              for pyd in root_path.glob("*__mypyc*.pyd"):
                  if pyd.parent == root_path:  # 确认是顶层
                      add_binary_args += ["--add-binary", f"{pyd};."]
                      print(f"Found mypyc pyd: {pyd}")

          # 也收集 pdfminer 包本身（以防有包内 .pyd）
          collect_args = ["--collect-all", "pdfminer"]

          cmd = [
              sys.executable, "-m", "PyInstaller",
              "--onefile",
              "--windowed",
              "--name", "InvoiceReader",
              "--add-data", "config/defaults.yaml;config",
              *collect_args,
              *add_binary_args,
              "src/invoice_reader/__main__.py",
          ]

          print("Running:", " ".join(str(c) for c in cmd))
          result = subprocess.run(cmd, check=True)
          sys.exit(result.returncode)

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceReader-windows
          path: dist/InvoiceReader.exe
          if-no-files-found: error

      - name: Upload to Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InvoiceReader.exe
