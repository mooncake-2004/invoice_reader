name: Build Windows EXE

on:
  push:
    branches: [feature/i18n, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Write mypyc hook
        shell: python
        run: |
          import site
          from pathlib import Path

          pyds = []
          for root in site.getsitepackages():
              root_path = Path(root)
              if not root_path.exists():
                  continue
              for pyd in root_path.glob("*__mypyc*.pyd"):
                  if pyd.parent == root_path:
                      pyds.append(str(pyd))
                      print(f"Found mypyc pyd: {pyd}")

          if not pyds:
              print("WARNING: no mypyc .pyd found!")

          lines = ["# Auto-generated hook for mypyc compiled pdfminer\n"]
          lines.append("binaries = [\n")
          for pyd in pyds:
              escaped = pyd.replace("\\", "\\\\")
              lines.append(f'    (r"{escaped}", "."),\n')
          lines.append("]\n")

          hook_content = "".join(lines)
          print("Hook content:")
          print(hook_content)
          Path("hook-pdfminer.py").write_text(hook_content, encoding="utf-8")

      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name InvoiceReader `
            --add-data "config/defaults.yaml;config" `
            --collect-all pdfminer `
            --collect-all invoice2data `
            --hidden-import invoice2data.extract `
            --hidden-import invoice2data.extract.invoice_template `
            --hidden-import invoice2data.input `
            --hidden-import invoice2data.output `
            --additional-hooks-dir . `
            src/invoice_reader/__main__.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceReader-Windows
          path: dist/InvoiceReader.exe
          if-no-files-found: error
