name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Write mypyc hook
        shell: python
        run: |
          import site
          from pathlib import Path

          # 找到所有顶层 mypyc .pyd，写进 hook 文件
          # hook 里用 datas/binaries 列表，PyInstaller 会正确处理 sys.path
          pyds = []
          for root in site.getsitepackages():
              root_path = Path(root)
              if not root_path.exists():
                  continue
              for pyd in root_path.glob("*__mypyc*.pyd"):
                  if pyd.parent == root_path:
                      pyds.append(str(pyd))
                      print(f"Found mypyc pyd: {pyd}")

          if not pyds:
              print("WARNING: no mypyc .pyd found!")

          # 生成 hook-pdfminer.py
          # binaries 列表格式: (src, dest_dir)
          # dest_dir="." 表示放到 _MEIPASS 根，正好是 sys.path[0]
          lines = ["# Auto-generated hook for mypyc compiled pdfminer\n"]
          lines.append("binaries = [\n")
          for pyd in pyds:
              escaped = pyd.replace("\\", "\\\\")
              lines.append(f'    (r"{escaped}", "."),\n')
          lines.append("]\n")

          hook_content = "".join(lines)
          print("Hook content:")
          print(hook_content)

          Path("hook-pdfminer.py").write_text(hook_content, encoding="utf-8")

      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name InvoiceReader `
            --add-data "config/defaults.yaml;config" `
            --collect-all pdfminer `
            --collect-all invoice2data `
            --additional-hooks-dir . `
            src/invoice_reader/__main__.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: InvoiceReader-windows
          path: dist/InvoiceReader.exe
          if-no-files-found: error

      - name: Upload to Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InvoiceReader.exe
