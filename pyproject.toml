[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-reader"
version = "0.1.0"
description = "Offline PDF viewer and field selection tool"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "Pillow>=10,<13",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

